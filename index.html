  // --- ELEMENTS ---
  const searchInput = document.getElementById('searchInput');
  const resultCount = document.getElementById('resultCount');
  const grid = document.getElementById('productGrid');
  const paginationContainer = document.getElementById('pagination');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  // --- HELPERS ---
  const totalPagesFor = (list) => Math.ceil(list.length / productsPerPage) || 1;

  function observeProductImage(img, skeleton) {
    const loadImage = () => {
      if (img.src) return;
      img.src = img.dataset.src;
      img.addEventListener('load', () => {
        img.classList.remove('opacity-0');
        skeleton.remove();
      }, { once: true });
      img.addEventListener('error', () => {
        skeleton.classList.remove('image-skeleton');
        skeleton.classList.add('bg-slate-100');
        skeleton.textContent = 'Image unavailable';
      }, { once: true });
    };

    if (!('IntersectionObserver' in window)) {
      loadImage();
      return;
    }

    imageObserver.observe(img);
    img._loadWhenVisible = loadImage;
  }

  function buildCard(product) {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.dataset.title = product.title;

    const link = document.createElement('a');
    link.href = product.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.className = 'flex flex-col bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl overflow-hidden';

    const imageWrap = document.createElement('div');
    imageWrap.className = 'relative w-full aspect-square overflow-hidden bg-slate-100';

    const skeleton = document.createElement('div');
    skeleton.className = 'image-skeleton absolute inset-0 grid place-items-center text-xs font-semibold text-slate-400';
    skeleton.setAttribute('aria-hidden', 'true');

    const img = document.createElement('img');
    img.dataset.src = product.image;
    img.alt = product.alt;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.className = 'relative z-10 w-full h-full object-cover opacity-0 transition-opacity duration-300';
    imageWrap.appendChild(skeleton);
    imageWrap.appendChild(img);
    observeProductImage(img, skeleton);

    const content = document.createElement('div');
    content.className = 'flex flex-1 flex-col p-4';

    const title = document.createElement('h2');
    title.className = 'text-lg font-semibold mb-1';
    title.textContent = product.title;

    const desc = document.createElement('p');
    desc.className = 'mb-4 text-sm leading-6 text-slate-500';
    const descriptionText = product.description || '';
    desc.textContent = descriptionText.length > 90
      ? descriptionText.slice(0, 90) + '...'
      : descriptionText;

    content.appendChild(title);
    content.appendChild(desc);

    const cta = document.createElement('span');
    cta.className = 'mt-auto inline-flex items-center font-bold text-blue-600';
    cta.textContent = 'View deal →';
    content.appendChild(cta);

    link.appendChild(imageWrap);
    link.appendChild(content);
    card.appendChild(link);

    return card;
  }

  function renderProducts() {
    const term = searchInput.value.toLowerCase();
    filteredProducts = [...products].reverse().filter(product =>
      product.title.toLowerCase().includes(term) ||
      product.description.toLowerCase().includes(term)
    );

    const totalPages = totalPagesFor(filteredProducts);
    resultCount.textContent = `${filteredProducts.length} ${filteredProducts.length === 1 ? 'product' : 'products'}`;
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * productsPerPage;
    const end = start + productsPerPage;
    const pageItems = filteredProducts.slice(start, end);

    if (imageObserver) imageObserver.disconnect();
    imageObserver = 'IntersectionObserver' in window
      ? new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            imageObserver.unobserve(entry.target);
            entry.target._loadWhenVisible?.();
          });
        }, { rootMargin: '240px 0px' })
      : null;
    grid.innerHTML = '';

    if (!filteredProducts.length) {
      const empty = document.createElement('p');
      empty.className = 'col-span-full text-center text-gray-500';
      empty.textContent = 'No products match your search yet. Check back soon for new additions.';
      grid.appendChild(empty);
      paginationContainer.style.display = 'none';
      return;
    }

    pageItems.forEach(product => grid.appendChild(buildCard(product)));

    if (totalPages <= 1) {
      paginationContainer.style.display = 'none';
    } else {
      paginationContainer.style.display = 'flex';
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
    }
  }

  // --- EVENTS ---
  searchInput.addEventListener('input', () => {
    currentPage = 1;
    renderProducts();
  });

  prevBtn.addEventListener('click', () => {
    if (currentPage > 1) {
      currentPage--;
      renderProducts();
    }
  });

  nextBtn.addEventListener('click', () => {
    const totalPages = totalPagesFor(filteredProducts);
    if (currentPage < totalPages) {
      currentPage++;
      renderProducts();
    }
  });

  // --- INITIALIZE ---
  renderProducts();
</script>
